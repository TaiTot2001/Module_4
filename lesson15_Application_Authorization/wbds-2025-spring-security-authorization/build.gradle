plugins {
    id 'java'
    id 'war'
}

group 'vn.codegym'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

ext {
    junitVersion = '5.10.2'
}

sourceCompatibility = '17'
targetCompatibility = '17'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

dependencies {
    compileOnly('jakarta.servlet:jakarta.servlet-api:6.1.0')
    // Spring MVC
    implementation("org.springframework:spring-webmvc:6.2.6")
    implementation 'org.springframework:spring-aspects:6.2.6'

    // ThymeLeaf
    implementation("org.thymeleaf:thymeleaf:3.1.2.RELEASE")
    implementation("org.thymeleaf:thymeleaf-spring6:3.1.2.RELEASE")
    implementation group: 'org.thymeleaf.extras', name: 'thymeleaf-extras-springsecurity6', version: '3.1.2.RELEASE'


    // Data Binding + Validation
    implementation("jakarta.validation:jakarta.validation-api:3.0.2")
    implementation("org.hibernate.validator:hibernate-validator:8.0.3.Final")
    // EL (expression language)
    // implementation("org.glassfish:jakarta.el:4.0.2")

    // ORM
    implementation("org.hibernate.orm:hibernate-core:7.1.1.Final") // JPA provider
    // MySQL Driver
    implementation("mysql:mysql-connector-java:8.0.33")

    // Spring Data JPA
    implementation("org.springframework.data:spring-data-jpa:3.4.10")

    // Spring Security 6.x for Jakarta EE
    implementation group: 'org.springframework.security', name: 'spring-security-web', version: '6.2.1'
    implementation group: 'org.springframework.security', name: 'spring-security-config', version: '6.2.1'
    implementation group: 'org.springframework.security', name: 'spring-security-taglibs', version: '6.2.1'

    testImplementation("org.junit.jupiter:junit-jupiter-api:${junitVersion}")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:${junitVersion}")
}

test {
    useJUnitPlatform()
}