<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="#{register.title}">Đăng ký</title>

    <style>
        body {
            font-family: "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #74ABE2, #5563DE);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        /* Đổi tên từ .login-container thành .register-container */
        .register-container {
            background: #fff;
            padding: 40px 50px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 350px;
            text-align: center;
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(-15px);}
            to {opacity: 1; transform: translateY(0);}
        }

        h1 {
            color: #333;
            margin-bottom: 25px;
            font-size: 24px;
        }

        /* Đây là class cho thông báo lỗi */
        .error-message {
            color: #d9534f;
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
            /* Thêm text-align để các lỗi của Thymeleaf hiển thị đẹp */
            text-align: left;
        }

        .success-message {
            color: #155724;
            background: #d4edda;
            border: 1px solid #c3e6cb;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        label {
            display: block;
            text-align: left;
            font-weight: 600;
            margin: 10px 0 5px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            transition: all 0.3s ease;
            /* Thêm box-sizing để padding không làm vỡ layout */
            box-sizing: border-box;
        }

        input:focus {
            border-color: #5563DE;
            box-shadow: 0 0 4px rgba(85, 99, 222, 0.5);
            outline: none;
        }

        button {
            width: 100%;
            background: #5563DE;
            border: none;
            padding: 12px;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            margin-top: 20px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #4350c6;
        }

        .language-select {
            margin-top: 20px;
        }

        select {
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background-color: #f9f9f9;
        }

        .footer-text {
            font-size: 12px;
            color: #777;
            margin-top: 25px;
        }
    </style>
</head>

<body>
<div class="register-container">
    <h1 th:text="#{register.title}">Đăng ký</h1>

    <!-- Thông báo đăng ký thành công (nếu có) -->
    <div th:if="${successMessage}" class="success-message" th:text="${successMessage}"></div>

    <!-- Form đăng ký -->
    <form th:action="@{/auth/register}" th:object="${user}" method="post">

        <!-- Username -->
        <label th:text="#{register.username}">Username:</label>
        <input type="text" th:field="*{username}" placeholder="Nhập tên đăng ký" required/>
        <!-- Áp dụng class 'error-message' cho div lỗi -->
        <div th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="error-message"></div>

        <!-- Password -->
        <label th:text="#{register.password}">Password:</label>
        <input type="password" th:field="*{password}" placeholder="Nhập mật khẩu đăng ký" required/>
        <!-- Áp dụng class 'error-message' cho div lỗi -->
        <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error-message"></div>

        <button type="submit" th:text="#{register.button}">Đăng ký</button>
    </form>

    <!-- Dropdown chọn ngôn ngữ (Giống hệt trang login) -->
    <div class="language-select">
        <!-- Sửa th:action trỏ về trang register -->
        <form method="get" th:action="@{/auth/register}">
            <label th:text="#{login.language}">Ngôn ngữ:</label>
            <select name="lang" onchange="this.form.submit()">
                <option value="en" th:selected="${#locale.language == 'en'}">English</option>
                <option value="vi" th:selected="${#locale.language == 'vi'}">Tiếng Việt</option>
            </select>
        </form>
    </div>

    <p class="footer-text">© 2025 My Blog Application</p>
</div>
</body>
</html>
