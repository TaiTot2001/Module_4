<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="page-container">
    <div th:replace="fragments :: header"></div>
    <main>
        <div class="post-form-container">
            <h1 th:text="#{post.form}">Danh sách bài viết</h1>
            <form th:action="@{/posts/save}" th:object="${post}" method="post">
                <input type="hidden" th:field="*{id}"/>

                <div>
                    <label th:text="#{post.title}">Title:</label>
                    <input type="text" th:field="*{title}" placeholder="Enter post title"/>
                    <div th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="error-message"></div>
                </div>

                <div>
                    <label th:text="#{post.content}">Content:</label>
                    <textarea th:field="*{content}" placeholder="Write something..."></textarea>
                    <div th:if="${#fields.hasErrors('content')}" th:errors="*{content}" class="error-message"></div>
                </div>

                <button type="submit" th:text="#{post.save}">Save</button>
            </form>

            <a th:href="@{/posts}" class="back-link" th:text="#{post.backlist}">← Back to list</a>
        </div>
    </main>
    <div th:replace="fragments :: footer"></div>
</div>
</body>
</html>
