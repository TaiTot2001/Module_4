<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${post.title}">Post Detail</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

</head>
<body>
<div class="page-container">
    <div th:replace="fragments :: header"></div>
    <main>
        <div class="post-container">
            <h1 th:text="${post.title}">Post Title</h1>
            <p><strong>Author:</strong> <span th:text="${post.author.username}">Author</span></p>
            <p th:text="${post.content}" class="post-content">Content</p>
            <a th:href="@{/posts}" class="back-btn">← Back to list</a>
        </div>
    </main>
    <div th:replace="fragments :: footer"></div>
</div>
</body>
</html>
